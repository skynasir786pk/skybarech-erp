# Android Studio / Gradle daemon crash fix
# If Gradle shows: "The daemon has terminated unexpectedly... Kotlin compile daemon is ready"
# build in single-process mode to avoid daemon startup crash on low RAM / bad daemon cache.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.workers.max=1

# Kotlin daemon disabled; compile Kotlin in the Gradle process.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.builder.sdkDownload=true
kotlin.code.style=official

# Current test server. Replace this once the permanent production domain is connected.
SKYBARECH_API_BASE_URL=https://lightgrey-cormorant-560478.hostingersite.com/api
